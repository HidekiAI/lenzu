name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libgtk-4-dev libgdk-pixbuf-2.0-dev libgraphene-1.0-dev
          libpango1.0-dev libcairo2-dev libx11-dev libxcb1-dev libxtst-dev
          libssl-dev pkg-config libmecab-dev
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

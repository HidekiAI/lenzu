# cargo-about configuration for the lenzu crate.
# Used by `make notices` to regenerate lenzu/NOTICES.crates.md.
#
# Run from the lenzu/ subdirectory:
#   cargo about generate about.hbs -o NOTICES.crates.md
#
# Updating this file:
#   1. If a new crate uses a license not in `accepted`, add it here only after
#      verifying it is permissive (MIT/Apache/BSD/ISC/Zlib/MPL family).
#   2. AGPL/GPL/SSPL family must NEVER appear in this list — Lenzu is MIT and
#      copyleft contamination via static linking is incompatible.
#   3. For dual-licensed crates, cargo-about picks the first match here.

# License IDs that are acceptable to ship in the lenzu .deb.
# Order matters: dual-licensed crates take the first match.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
]

# Crates whose license metadata is missing/ambiguous in their Cargo.toml.
# Add entries here only after manually confirming the upstream license file.
# (None needed today; populate as cargo-about flags issues.)

[package]
name = "lenzu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lenzu"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = { version = "0.18", features = ["v3_24"] }
glib = "0.18"
async-channel = "2"
gdk-pixbuf = "0.18"
cairo-rs = "0.18"
pango = "0.18"
pangocairo = "0.18"
x11rb = { version = "0.13", features = ["all-extensions"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
chrono = "0.4"
isolang = { version = "2.4.0" , features = ["serde"]}
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
wiremock = "0.6"

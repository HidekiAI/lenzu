[package]
name = "lenzu"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
libc = "0.2.153"

# If you start getting link errors, try MAKE SURE you are calling `cargo build` on a REAL MinGW64 terminal
[features]
default = ["gtk", "onnx"]
gtk = ["gtk4", "gdk4", "glib"]
onnx = ["ort", "ndarray"]

[dependencies]
image = "0.25.1"
imageproc = "0.24.0"
rusty-tesseract = "1.1.10"
pkg-config = "0.3.30"
anyhow = "1.0.82"
reqwest = { version = "0.12.3", features = ["json", "gzip", "blocking", "rustls-tls"] }
ab_glyph = "0.2.25"
futures = "0.3.30"
tokio = { version = "1.37.0", features = ["test-util", "time", "fs", "full", "rt-multi-thread", "macros"] }
encoding_rs = { version = "0.8.34", features = ["fast-kanji-encode", "less-slow-kanji-encode"] }
mecab = "0.1.6"
async-channel = "2.2.1"

ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.15.6", optional = true }

gtk4 = { version = "0.8.1", features = ["v4_14"], optional = true }
gdk4 = { version = "0.8.1", features = ["v4_14"], optional = true }
glib = { version = "0.19.4", features = ["gio", "gio_ffi"], optional = true }
once_cell = "1.19.0"
zerocopy = { version = "0.7.32", features = ["alloc", "byteorder"] }

[target.'cfg(linux)'.dependencies.gdk4-wayland]
version = "0.8.1"
features = ["wayland-backend", "wayland-client", "egl"]
optional = true

[target.'cfg(linux)'.dependencies.gdk4-x11]
version = "0.8.1"
features = ["x11", "xlib", "egl"]
optional = true

# Until prototype is done, we'll allow Linux specific code
[target.'cfg(linux)'.dependencies.x11]
version = "^2.21.0"
features = ["xlib"]

[target.'cfg(linux)'.dependencies.x11rb]
version = "0.13.0"
features = ["all-extensions"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.56.0"
features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Win32_System_SystemServices",
    "Foundation_Collections",
]

# Until prototype is done, we'll allow Windows specific code
[target.'cfg(windows)'.dependencies]
winapi = { version = "^0.3.9", features = [
    "winbase",
    "windef",
    "winsock2",
    "namedpipeapi",
    "winuser",
    "everything",
] }


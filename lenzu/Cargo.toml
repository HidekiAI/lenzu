[package]
name = "lenzu"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25.1"
imageproc = "0.24.0"
rusty-tesseract = "1.1.10"
pkg-config = "0.3.30"
anyhow = "1.0.82"
reqwest = { version = "0.12.3", features = ["json", "gzip", "blocking", "rustls-tls"] }
ab_glyph = "0.2.25"
futures = "0.3.30"
tokio = { version = "1.37.0", features = ["test-util", "time", "fs", "full", "rt-multi-thread", "macros"] }
encoding_rs = { version = "0.8.34", features = ["fast-kanji-encode", "less-slow-kanji-encode"] }
mecab = "0.1.6"
async-channel = "2.2.1"

# based on gtk version:
#   $ pkg-config --modversion gtk4
#   4.14.2
gtk4 = { version = "0.8.1", features = ["v4_14"] }
gdk4 = { version = "0.8.1", features = ["v4_14"] }
glib = { version = "0.19.4", features = ["gio", "gio_ffi"] }    # hopefully, glib/gobject binding contains grpahene-sys as well
once_cell = "1.19.0"
zerocopy = { version = "0.7.32", features = ["alloc", "byteorder"] }

# Neural Network stack
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.15.6", optional = true }

# UI stack - Removed invalid "x11" feature, using "v3_24"
gtk = { version = "0.18.1", optional = true }
gdk = { version = "0.18.1", features = ["v3_24"], optional = true }
glib = { version = "0.18.5", optional = true }
gdk-pixbuf = { version = "0.18.5", optional = true }
gio = { version = "0.18.4", optional = true }

[target.'cfg(linux)'.dependencies.gdk4-x11]
version = "0.8.1"
features = ["x11", "xlib", "egl"]

# Until prototype is done, we'll allow Linux specific code
[target.'cfg(linux)'.dependencies.x11]
version = "^2.21.0"
features = ["xlib"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.56.0"
features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Win32_System_SystemServices",
    "Foundation_Collections",
]

# Until prototype is done, we'll allow Windows specific code
[target.'cfg(windows)'.dependencies]
winapi = { version = "^0.3.9", features = [
    "winbase",
    "windef",
    "winsock2",
    "namedpipeapi",
    "winuser",
    "everything",
] }


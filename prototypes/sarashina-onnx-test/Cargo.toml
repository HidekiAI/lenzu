[package]
name = "sarashina-onnx-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sarashina-onnx-test"
path = "src/main.rs"

[dependencies]
ort        = { version = "2.0.0-rc.12", features = ["ndarray", "half"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
ndarray    = "0.15"
half       = { version = "2.4", features = ["num-traits"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1.0"

[features]
default = []
cuda    = ["ort/cuda"]

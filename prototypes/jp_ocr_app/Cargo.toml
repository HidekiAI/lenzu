[package]
name = "jp_ocr_app"
version = "0.1.0"
edition = "2021"

[dependencies]
# Updated to the latest stable version
anyhow = "1.0"

ocr-rs = "2.1" 
ort = { version = "2.0.0-rc.12", features = ["ndarray", "half"] }
image = "0.25"
ndarray = "0.15"
half = { version = "2.4", features = ["num-traits"] }

gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
x11rb = "0.13"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"


[build-dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
zip = "0.6"
anyhow = "1.0"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
strsim = "0.11"

[package]
name = "jp_ocr_app"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI and Screen Capture
gtk = { version = "0.18", features = ["v3_24"] }
gdk = { version = "0.18", features = ["v3_24"] }
glib = "0.18"
gdk-pixbuf = "0.22"
cairo-rs = "0.18"
pango = "0.18"
pangocairo = "0.18"
x11rb = "0.13"

# Networking and API
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
chrono = "0.4"

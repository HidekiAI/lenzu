[package]
name = "x11-gtk3-lens-test"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI and System
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
cairo-rs = "0.18"
gdk-pixbuf = "0.18"
x11rb = "0.13"

# AI and Math (CRITICAL: These versions must match)
# We use ndarray 0.15 because ort 2.0-rc.9 is built against it
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }
ndarray = "0.15"

# Image processing (optional but helpful for AI)
image = "0.24"

[package]
name = "kakasi-static-libs"
version = "0.1.0"
edition = "2021"

[build-dependencies]
bindgen = "0.69.4"

[lib]
crate-type = ["staticlib"]

[dependencies]
encoding_rs = { version = "0.8.34", features = ["fast-kanji-encode", "less-slow-kanji-encode"] }
tokio = { version = "1.37.0", features = ["time", "test-util", "macros"] }

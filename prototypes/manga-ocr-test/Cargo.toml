[package]
name = "manga-ocr-test"
version = "0.1.0"
edition = "2021"

# lib is auto-detected from src/lib.rs (thin re-export of manga-ocr-rs).
# The binary is an explicit CLI wrapper around it.
[[bin]]
name = "manga-ocr-test"
path = "src/main.rs"

# ─── Dependencies ────────────────────────────────────────────────────────────

[dependencies]
manga-ocr-rs = "0.1"
image         = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow        = "1.0"

[dev-dependencies]
serde_json = "1.0"

[package]
name = "gtk_gdk_test"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-channel = "2.2.1"
gtk4 = "0.8.1"
pkg-config = "0.3.30"
anyhow = "1.0.80"
reqwest = { version = "0.12.0", features = ["json", "gzip", "blocking", "rustls-tls"] }
tokio = { version = "1.37.0", features = ["test-util", "time", "fs", "full", "rt-multi-thread", "macros"] }
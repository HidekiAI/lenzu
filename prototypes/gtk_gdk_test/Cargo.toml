[package]
name = "gtk_gdk_test"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2.2.1"

pkg-config = "0.3.30"
anyhow = "1.0.80"
reqwest = { version = "0.12.0", features = [
    "json",
    "gzip",
    "blocking",
    "rustls-tls",
] }
tokio = { version = "1.37.0", features = [
    "test-util",
    "time",
    "fs",
    "full",
    "rt-multi-thread",
    "macros",
] }

# based on gtk version:
#   $ pkg-config --modversion gtk4
#   4.14.2
gtk4 = { version = "0.8.1", features = ["v4_14"] }

[target.'cfg(windows)'.dependencies.gdk4-win32]
version = "0.8.1"
features = ["win32", "windows"]

[target.'cfg(linux)'.dependencies.gdk4-wayland]
version = "0.8.1"
features = ["wayland-backend", "wayland-client"]
